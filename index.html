<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leasing Matters</title>

<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />

<style>
  /* Logo slot — the official Dolmen logo has not been supplied yet.
     Keep a defined, correctly-sized placeholder; swap in <img> once provided. */
  .topbar__logo {
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--accent-tint, rgba(10, 132, 255, 0.12));
    color: var(--accent, #0a84ff);
    font-weight: 700; font-size: 12px; letter-spacing: 0.02em;
    flex: 0 0 auto;
  }
  .topbar__logo img { width: 100%; height: 100%; object-fit: contain; }
  .topbar__brand { display: flex; align-items: center; gap: var(--sp-3, 12px); }
</style>
</head>
<body>

<div class="app-shell">

  <header class="topbar">
    <div class="topbar__brand">
      <!-- LOGO SLOT: replace inner text with <img src="..." alt="Dolmen"> when the official logo is provided -->
      <div class="topbar__logo" id="logoSlot" title="Company logo — pending official asset" aria-label="Company logo placeholder">LM</div>
      <span class="topbar__title">Leasing Matters</span>
    </div>

    <div id="mallSelectorSlot"></div>

    <div class="topbar__spacer"></div>

    <div class="topbar__right">
      <div id="userSelectorSlot"></div>
      <button type="button" class="btn btn--primary" id="newIssueBtn">+ New Issue</button>
    </div>
  </header>

  <nav class="sidebar" id="sidebar" aria-label="Primary navigation"></nav>

  <main class="main">
    <div id="viewRoot" class="view"></div>
  </main>

</div>

<div id="modalRoot"></div>
<div id="slideoverRoot"></div>
<div id="toastRoot"></div>

<!-- Microsoft sign-in library (used only in SharePoint mode; harmless to preload).
     Loaded as a normal tag rather than via document.write so the browser never
     treats it as a parser-blocking cross-site script. -->
<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>

<!-- ===== Config: chooses SharePoint vs local-demo data ===== -->
<script src="js/config.js"></script>

<!-- ===== Shared: utilities, validation, UI state ===== -->
<script src="js/utils.js"></script>
<script src="js/dal/validation.js"></script>
<script src="js/state/appState.js"></script>

<!-- ===== Mode-specific storage + Data Access Layer =====
     document.write keeps these synchronous and in-order with no build step. -->
<script>
(function () {
  var sp = window.App.Config.isSharePoint;
  var srcs = sp
    ? [
        "js/auth/authService.js",
        "js/storage/sharePointAdapter.js",
        "js/storage/counterService.js",
        "js/storage/activityLogAdapter.js",
        "js/auth/authGate.js",
        "js/dal/issuesApiSharePoint.js"
      ]
    : [
        "js/storage/mockData.js",
        "js/storage/localStorageAdapter.js",
        "js/dal/idGenerator.js",
        "js/dal/issuesApiLocal.js"
      ];
  for (var i = 0; i < srcs.length; i++) {
    document.write('<script src="' + srcs[i] + '"><\/script>');
  }
})();
</script>

<!-- ===== Components ===== -->
<script src="js/components/toast.js"></script>
<script src="js/components/mallSelector.js"></script>
<script src="js/components/userSelector.js"></script>
<script src="js/components/sidebar.js"></script>
<script src="js/components/activityHistory.js"></script>
<script src="js/components/issueForm.js"></script>
<script src="js/components/issueDetail.js"></script>
<script src="js/components/dashboard.js"></script>
<script src="js/components/activeIssues.js"></script>
<script src="js/components/resolvedArchive.js"></script>

<!-- ===== App entry point ===== -->
<script src="js/app.js"></script>

</body>
</html>
