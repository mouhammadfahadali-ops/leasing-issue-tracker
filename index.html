<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leasing Matters</title>

<!-- Apply the saved theme before the stylesheets paint — avoids a flash. -->
<script>
  (function () {
    try {
      var t = localStorage.getItem("leasingMatters_theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* private mode / storage blocked — fall back to OS theme */ }
  })();
</script>

<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
</head>
<body>

<div class="app-shell">

  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__title">Leasing Matters</span>
    </div>

    <div id="mallSelectorSlot"></div>

    <div class="topbar__spacer"></div>

    <div class="topbar__right">
      <div id="themeToggleSlot"></div>
      <div id="userSelectorSlot"></div>
      <button type="button" class="btn btn--primary" id="newIssueBtn">+ New Issue</button>
    </div>
  </header>

  <nav class="sidebar" id="sidebar" aria-label="Primary navigation"></nav>

  <main class="main">
    <div id="viewRoot" class="view"></div>
  </main>

</div>

<div id="modalRoot"></div>
<div id="slideoverRoot"></div>
<div id="toastRoot"></div>

<!-- Microsoft sign-in library (used only in SharePoint mode; harmless to preload).
     Loaded as a normal tag rather than via document.write so the browser never
     treats it as a parser-blocking cross-site script. -->
<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>

<!-- ===== Config: chooses SharePoint vs local-demo data ===== -->
<script src="js/config.js"></script>

<!-- ===== Shared: utilities, validation, UI state ===== -->
<script src="js/utils.js"></script>
<script src="js/dal/validation.js"></script>
<script src="js/state/appState.js"></script>

<!-- ===== Mode-specific storage + Data Access Layer =====
     document.write keeps these synchronous and in-order with no build step. -->
<script>
(function () {
  var sp = window.App.Config.isSharePoint;
  var srcs = sp
    ? [
        "js/auth/authService.js",
        "js/storage/sharePointAdapter.js",
        "js/storage/counterService.js",
        "js/storage/activityLogAdapter.js",
        "js/auth/authGate.js",
        "js/dal/issuesApiSharePoint.js"
      ]
    : [
        "js/storage/mockData.js",
        "js/storage/localStorageAdapter.js",
        "js/dal/idGenerator.js",
        "js/dal/issuesApiLocal.js"
      ];
  for (var i = 0; i < srcs.length; i++) {
    document.write('<script src="' + srcs[i] + '"><\/script>');
  }
})();
</script>

<!-- ===== Components ===== -->
<script src="js/components/toast.js"></script>
<script src="js/components/themeToggle.js"></script>
<script src="js/components/exportData.js"></script>
<script src="js/components/mallSelector.js"></script>
<script src="js/components/userSelector.js"></script>
<script src="js/components/sidebar.js"></script>
<script src="js/components/activityHistory.js"></script>
<script src="js/components/issueForm.js"></script>
<script src="js/components/issueDetail.js"></script>
<script src="js/components/dashboard.js"></script>
<script src="js/components/activeIssues.js"></script>
<script src="js/components/resolvedArchive.js"></script>

<!-- ===== App entry point ===== -->
<script src="js/app.js"></script>

</body>
</html>
